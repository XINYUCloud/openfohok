<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes" />
    <title>文谶驿站 · 墨引思潮</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap');
    
        * {
            font-family: 'Noto Serif SC', serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #fcfcfc;
            --surface-color: #ffffff;
            --border-color: #f0f0f0;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --primary-color: #2d6a4f;
            --primary-hover: #1e4a37;
            --primary-light: #d2e8d4;
            --card-bg: #ffffff;
            --hover-bg: #f9fafb;
            --logo-light: url('https://fohok.xin/img/logo-114514.png');
            --logo-dark: url('https://fohok.xin/img/logo-114514.png');
        }

        .dark {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --primary-color: #81d8a1;
            --primary-hover: #5abf7e;
            --primary-light: #154f33;
            --card-bg: #1e293b;
            --hover-bg: #2d3a52;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        .logo-img {
            background-image: var(--logo-light);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
            height: 2.5rem;
            width: 9rem;
            display: block;
        }

        .dark .logo-img {
            background-image: var(--logo-dark);
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .loading-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            display: block;
            width: 150px;
            height: auto;
        }

        .loader_body,
        .loader_front,
        .loader_handlebars,
        .loader_pedals,
        .loader_pedals-spin,
        .loader_seat,
        .loader_spokes,
        .loader_spokes-spin,
        .loader_tire {
            animation: bikeBody 3s ease-in-out infinite;
            stroke: #2d6a4f;
        }

        .dark .loader_body,
        .dark .loader_front,
        .dark .loader_handlebars,
        .dark .loader_pedals,
        .dark .loader_pedals-spin,
        .dark .loader_seat,
        .dark .loader_spokes,
        .dark .loader_spokes-spin,
        .dark .loader_tire {
            stroke: #81d8a1;
        }

        .loader_front {
            animation-name: bikeFront;
        }

        .loader_handlebars {
            animation-name: bikeHandlebars;
        }

        .loader_pedals {
            animation-name: bikePedals;
        }

        .loader_pedals-spin {
            animation-name: bikePedalsSpin;
        }

        .loader_seat {
            animation-name: bikeSeat;
        }

        .loader_spokes,
        .loader_tire {
            stroke: #2d6a4f;
        }

        .dark .loader_spokes,
        .dark .loader_tire {
            stroke: #81d8a1;
        }

        .loader_spokes {
            animation-name: bikeSpokes;
        }

        .loader_spokes-spin {
            animation-name: bikeSpokesSpin;
        }

        .loader_tire {
            animation-name: bikeTire;
        }

        @keyframes bikeBody {
            from { stroke-dashoffset: 79; }
            33%, 67% { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -79; }
        }

        @keyframes bikeFront {
            from { stroke-dashoffset: 19; }
            33%, 67% { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -19; }
        }

        @keyframes bikeHandlebars {
            from { stroke-dashoffset: 10; }
            33%, 67% { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -10; }
        }

        @keyframes bikePedals {
            from { stroke-dashoffset: -25.133; }
            33%, 67% { stroke-dashoffset: -21.991; }
            to { stroke-dashoffset: -25.133; }
        }

        @keyframes bikePedalsSpin {
            from { transform: rotate(0.1875turn); }
            to { transform: rotate(3.1875turn); }
        }

        @keyframes bikeSeat {
            from { stroke-dashoffset: 5; }
            33%, 67% { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -5; }
        }

        @keyframes bikeSpokes {
            from { stroke-dashoffset: -31.416; }
            33%, 67% { stroke-dashoffset: -23.562; }
            to { stroke-dashoffset: -31.416; }
        }

        @keyframes bikeSpokesSpin {
            from { transform: rotate(0); }
            to { transform: rotate(3turn); }
        }

        @keyframes bikeTire {
            from { stroke-dashoffset: 56.549; transform: rotate(0); }
            33% { stroke-dashoffset: 0; transform: rotate(0.33turn); }
            67% { stroke-dashoffset: 0; transform: rotate(0.67turn); }
            to { stroke-dashoffset: -56.549; transform: rotate(1turn); }
        }

        .modal-base {
            display: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-base.modal-active {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            transition: transform 0.3s ease;
            transform: translateY(20px);
        }

        .modal-active .modal-content {
            transform: translateY(0);
        }

        .article-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 1.25rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            overflow: hidden;
        }

        .article-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .article-cover {
            flex-shrink: 0;
            width: 148px;
            height: 148px;
            border-radius: 0.75rem;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, var(--primary-light), var(--hover-bg));
        }

        .article-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: transform 0.5s ease, opacity 0.4s ease;
        }

        .article-cover img.loaded {
            opacity: 1;
        }

        .article-card:hover .article-cover img {
            transform: scale(1.06);
        }

        .article-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            opacity: 0.55;
        }

        .article-cover-placeholder svg {
            width: 2.75rem;
            height: 2.75rem;
        }

        .article-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            justify-content: center;
        }

        .article-title {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--primary-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            white-space: nowrap;
        }

        .meta-icon {
            width: 0.9rem;
            height: 0.9rem;
            flex-shrink: 0;
        }

        .article-summary {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            max-width: 100%;
        }

        .nav-bar {
            background-color: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .dark .nav-bar {
            background-color: rgba(15, 23, 42, 0.9);
        }

        .pagination-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .pagination-btn:hover {
            background-color: var(--hover-bg);
        }

        .pagination-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .dark .pagination-btn.active {
            background-color: var(--primary-color);
            color: #0f172a;
        }

        .modal-bg {
            background-color: var(--surface-color);
        }

        .input-field {
            background-color: var(--hover-bg);
            color: var(--text-primary);
            border: 1px solid transparent;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .toast-message {
            background-color: #18181b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            font-size: 0.875rem;
            z-index: 100;
            position: fixed;
            top: 5rem;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .dark .toast-message {
            background-color: #334155;
        }

        .portal-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
            color: var(--primary-color);
            background-color: transparent;
        }

        .portal-link-btn:hover {
            background-color: var(--primary-light);
            transform: scale(1.05);
        }

        .site-footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 0 2rem;
            text-align: center;
        }

        .beian-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .beian-info a {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: inherit;
            transition: color 0.2s ease;
        }

        .beian-info a:hover {
            color: var(--primary-color);
        }

        @media (min-width: 768px) {
            .article-card {
                padding: 1.75rem;
                gap: 1.5rem;
            }
            .article-cover {
                width: 180px;
                height: 180px;
            }
            .article-title {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 480px) {
            .article-card {
                padding: 0.85rem;
                gap: 0.85rem;
            }
            .article-cover {
                width: 92px;
                height: 92px;
            }
            .article-title {
                font-size: 1.05rem;
                -webkit-line-clamp: 2;
            }
            .article-meta {
                gap: 0.4rem 0.75rem;
                font-size: 0.72rem;
            }
            .article-summary {
                font-size: 0.82rem;
                -webkit-line-clamp: 2;
            }
        }
    </style>
</head>

<script>
    (function() {
        const API_URL = 'https://fohok.xin/rss/index.php';
        const SUB_API = 'https://fohok.xin/rss/subscribe.php';
        let allArticles = [];
        let currentPage = 1;
        const pageSize = 5;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function cleanContent(rawText) {
            if (!rawText) return '';
            let text = rawText.replace(/<img[^>]*>/gi, '');
            text = text.replace(/<[^>]*>/g, ' ');
            text = text.replace(/\{cat_bili[^}]*\}/gi, '');
            text = text.replace(/https?:\/\/\S+\.(gif|png|jpg|jpeg|webp)(\?\S*)?/gi, '');
            text = text.replace(/\s+/g, ' ').trim();
            if (text.length > 180) {
                text = text.substring(0, 180) + '…';
            }
            return text || '展卷细读，洞悉价值。';
        }

        function toggleTheme() {
            const isDark = !document.body.classList.contains('dark');
            document.body.classList.toggle('dark', isDark);
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            }
            localStorage.setItem('site_theme', isDark ? 'dark' : 'light');
        }

        async function fetchData() {
            try {
                const resp = await fetch(API_URL);
                if (!resp.ok) throw new Error('Network error');
                allArticles = await resp.json();
                allArticles.sort((a, b) => new Date(b.pub_time) - new Date(a.pub_time));
                renderPage(1);
            } catch (e) {
                document.getElementById('article-list').innerHTML = '<div class="text-center py-20" style="color: var(--text-muted);">驿站信号不佳，请刷新重试</div>';
            } finally {
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.classList.add('loading-hidden');
                }, 600);
            }
        }

        window.handleCoverError = function(img) {
            const placeholder = document.createElement('span');
            placeholder.className = 'article-cover-placeholder';
            placeholder.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16l5-5 4 4 3-3 6 6"></path><circle cx="8" cy="9" r="1.5" stroke-width="1.5"></circle></svg>';
            img.replaceWith(placeholder);
        };

        // 图片懒加载：图片进入视口附近才真正加载，加载完成淡入显示
        const lazyCoverObserver = ('IntersectionObserver' in window)
            ? new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const img = entry.target;
                    const realSrc = img.getAttribute('data-src');
                    observer.unobserve(img);
                    if (!realSrc) return;
                    img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
                    img.src = realSrc;
                });
            }, { root: null, rootMargin: '200px 0px', threshold: 0.01 })
            : null;

        function initLazyCovers(container) {
            const imgs = container.querySelectorAll('img.lazy-cover[data-src]');
            imgs.forEach(img => {
                if (lazyCoverObserver) {
                    lazyCoverObserver.observe(img);
                } else {
                    // 不支持 IntersectionObserver 的老旧浏览器，直接加载
                    img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
                    img.src = img.getAttribute('data-src');
                }
            });
        }

        function renderPage(page) {
            currentPage = page;
            const start = (page - 1) * pageSize;
            const data = allArticles.slice(start, start + pageSize);
            const container = document.getElementById('article-list');
            
            if (!data.length) {
                container.innerHTML = '<div class="text-center py-16" style="color: var(--text-muted);">暂无文章</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            container.innerHTML = data.map(item => {
                const title = escapeHtml(item.title);
                const site = escapeHtml(item.site_name);
                const author = escapeHtml(item.author || '佚名');
                const time = escapeHtml(item.pub_time);
                const link = escapeHtml(item.link);
                const imageUrl = item.image_url ? escapeHtml(item.image_url) : '';
                const rawSummary = item.summary || item.description || '';
                const cleanSummary = cleanContent(stripHtml(rawSummary));

                const placeholderSvg = `<span class="article-cover-placeholder">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16l5-5 4 4 3-3 6 6"></path><circle cx="8" cy="9" r="1.5" stroke-width="1.5"></circle></svg>
                </span>`;

                const coverHtml = imageUrl
                    ? `<img data-src="${imageUrl}" alt="" loading="lazy" class="lazy-cover" onerror="window.handleCoverError(this)">`
                    : placeholderSvg;
                
                return `
                    <a href="${link}" target="_blank" rel="noopener noreferrer" class="article-card block">
                        <div class="article-cover">${coverHtml}</div>
                        <div class="article-body">
                            <h3 class="article-title" title="${title}">${title}</h3>
                            <div class="article-meta">
                                <span class="meta-item">
                                    <svg class="meta-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                                    ${site}
                                </span>
                                <span class="meta-item">
                                    <svg class="meta-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    ${author}
                                </span>
                                <span class="meta-item">
                                    <svg class="meta-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    ${time}
                                </span>
                            </div>
                            <p class="article-summary">${cleanSummary}</p>
                        </div>
                    </a>
                `;
            }).join('');

            initLazyCovers(container);
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const total = Math.ceil(allArticles.length / pageSize);
            const paginationDiv = document.getElementById('pagination');
            if (total <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }
            let html = '';
            for (let i = 1; i <= total; i++) {
                html += `<button onclick="window.renderPage(${i})" class="pagination-btn ${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            paginationDiv.innerHTML = html;
        }

        window.renderPage = renderPage;

        window.openSubDialog = function() {
            document.getElementById('subModal').classList.add('modal-active');
        };

        window.closeSubDialog = function() {
            document.getElementById('subModal').classList.remove('modal-active');
        };

        window.confirmSubscribe = async function() {
            const emailInput = document.getElementById('userEmail');
            const email = emailInput.value.trim();
            const btn = event.target;

            if (!email || !email.includes('@')) {
                showToast('邮箱格式似乎不太对哦。');
                return;
            }

            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                const response = await fetch(SUB_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const result = await response.json();
                showToast(result.message || '订阅请求已发出。');
                if (result.message && (result.message.includes('成功') || result.message.includes('已在'))) {
                    window.closeSubDialog();
                    emailInput.value = '';
                }
            } catch (error) {
                showToast('连接驿站失败，请稍后再试。');
            } finally {
                btn.disabled = false;
                btn.textContent = '确认订阅';
            }
        };

        function showToast(msg) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();
            const div = document.createElement('div');
            div.className = 'toast-message';
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('site_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            }
            fetchData();
        };

        window.toggleTheme = toggleTheme;
    })();
</script>
</body>
