name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: 检查所有 PHP 文件语法
        run: |
          find . -type f -name '*.php' -not -path './rss/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  python-check:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编译检查
        run: python -m compileall -q rss
